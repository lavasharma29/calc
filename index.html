<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calc — Scientific Calculator</title><style>
:root{--bg:#0b0d12;--panel:#151922;--key:#232936;--key2:#303746;--text:#f5f7fb;--muted:#8992a4;--accent:#8b7cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#252b3b,#0b0d12 48%);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.calc{width:min(440px,100%);background:#151922f5;border:1px solid #2b3140;border-radius:26px;box-shadow:0 28px 80px #0009;overflow:hidden}.top{padding:20px 22px 8px;display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:.8px}.mode{font-size:12px;color:#c8c1ff;background:#292443;border:1px solid #4a3f7e;border-radius:99px;padding:6px 10px}
.display{padding:18px 22px 20px;min-height:140px;display:flex;flex-direction:column;justify-content:end;text-align:right}.expr{color:var(--muted);font-size:17px;min-height:27px;overflow:auto;white-space:nowrap}.result{font-size:48px;font-weight:650;letter-spacing:-2px;overflow:auto;white-space:nowrap}
.controls{display:flex;gap:7px;padding:0 17px 13px}.toggle{flex:1;background:#1d222d;border:1px solid #303746;color:var(--muted);border-radius:10px;padding:8px 5px;font-size:11px;cursor:pointer}.toggle.active{color:#fff;background:#302a50;border-color:#554b91}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;padding:0 14px 16px}.key{height:55px;border:0;border-radius:14px;background:var(--key);color:var(--text);font-size:17px;font-weight:600;cursor:pointer;transition:.1s}.key:hover{background:var(--key2)}.key:active{transform:scale(.95)}.fn{color:#c9c2ff;font-size:14px}.op{background:#292f3a}.clear{color:#ff8d96}.eq{background:linear-gradient(135deg,#8b7cff,#6757f5)}.wide{grid-column:span 2}
.history{padding:0 20px 18px}.ht{font-size:10px;letter-spacing:1.3px;color:var(--muted);margin-bottom:5px}.hi{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #252b35;color:#aeb6c5;font-size:12px}.hi b{color:#fff}
@media(max-width:420px){.key{height:51px}.result{font-size:41px}}
</style></head><body><main class="calc"><div class="top"><div class="brand">CALC</div><div class="mode" id="mode">DEG</div></div><div class="display"><div class="expr" id="expr"></div><div class="result" id="result">0</div></div><div class="controls"><button class="toggle active" id="deg">DEG</button><button class="toggle" id="rad">RAD</button><button class="toggle" id="inv">INV</button><button class="toggle" id="clearHistory">CLEAR</button></div><div class="keys" id="keys">
<button class="key fn" data-f="sin(">sin</button><button class="key fn" data-f="cos(">cos</button><button class="key fn" data-f="tan(">tan</button><button class="key fn" data-f="log(">log</button><button class="key fn" data-f="ln(">ln</button>
<button class="key fn" data-f="sqrt(">√</button><button class="key fn" data-v="(">(</button><button class="key fn" data-v=")">)</button><button class="key fn" data-v="π">π</button><button class="key fn" data-v="e">e</button>
<button class="key" data-v="^2">x²</button><button class="key" data-v="^">xʸ</button><button class="key fn" data-f="inv(">1/x</button><button class="key fn" data-v="!">n!</button><button class="key clear" data-a="clear">AC</button>
<button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="÷">÷</button><button class="key op" data-v="%">%</button>
<button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="×">×</button><button class="key op" data-v="−">−</button>
<button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="+">+</button><button class="key op" data-a="back">⌫</button>
<button class="key wide" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key eq" data-a="eq">=</button></div><div class="history"><div class="ht">HISTORY</div><div id="history"></div></div></main>
<script>
let s="",ang="DEG",inv=false,hist=[];const E=document.getElementById("expr"),R=document.getElementById("result"),H=document.getElementById("history");
function fmt(n){if(Math.abs(n)<1e-12)n=0;return Number(n.toPrecision(12)).toString()}
function fact(n){if(n<0||n%1||n>170)throw Error();let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function calc(x){x=x.replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-").replaceAll("π","PI").replace(/\^/g,"**");x=x.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)").replace(/(\d+(?:\.\d+)?)!/g,"fact($1)");const m={PI:Math.PI,e:Math.E,sin:a=>Math.sin(ang=="DEG"?a*Math.PI/180:a),cos:a=>Math.cos(ang=="DEG"?a*Math.PI/180:a),tan:a=>Math.tan(ang=="DEG"?a*Math.PI/180:a),log:a=>Math.log10(a),ln:a=>Math.log(a),sqrt:Math.sqrt,inv:a=>1/a,fact};return Function(...Object.keys(m),'"use strict";return '+x)(...Object.values(m))}
function render(){E.textContent=s;try{R.textContent=s?fmt(calc(s)):0}catch{R.textContent="…"}}
function draw(){H.innerHTML=hist.map(x=>'<div class="hi"><span>'+x.e+'</span><b>'+x.r+'</b></div>').join("")}
function equals(){if(!s)return;try{let n=calc(s);if(!Number.isFinite(n))throw Error();hist.unshift({e:s,r:fmt(n)});hist=hist.slice(0,6);draw();E.textContent=s+" =";s=fmt(n);R.textContent=s}catch{R.textContent="Error"}}
document.getElementById("keys").onclick=e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.a=="clear"){s="";render()}else if(b.dataset.a=="back"){s=s.slice(0,-1);render()}else if(b.dataset.a=="eq")equals();else{s+=b.dataset.f||b.dataset.v;render()}};
document.getElementById("deg").onclick=()=>{ang="DEG";document.getElementById("deg").classList.add("active");document.getElementById("rad").classList.remove("active");document.getElementById("mode").textContent=ang;render()};
document.getElementById("rad").onclick=()=>{ang="RAD";document.getElementById("rad").classList.add("active");document.getElementById("deg").classList.remove("active");document.getElementById("mode").textContent=ang;render()};
document.getElementById("inv").onclick=()=>{inv=!inv;document.getElementById("inv").classList.toggle("active",inv);let a=inv?["asin(","acos(","atan(","log10(","exp(","cbrt("]:["sin(","cos(","tan(","log(","ln(","sqrt("];document.querySelectorAll("[data-f]").forEach((b,i)=>{b.dataset.f=a[i];b.textContent=a[i].replace("(","").replace("asin","sin⁻¹").replace("acos","cos⁻¹").replace("atan","tan⁻¹").replace("log10","10ˣ").replace("exp","eˣ").replace("cbrt","∛")})};
document.getElementById("clearHistory").onclick=()=>{hist=[];draw()};
document.addEventListener("keydown",e=>{if(/[0-9.]/.test(e.key))s+=e.key;else if("+-*/%()".includes(e.key))s+=e.key=="*"?"×":e.key=="/"?"÷":e.key;else if(e.key=="Enter")return equals();else if(e.key=="Backspace")s=s.slice(0,-1);else if(e.key=="Escape")s="";render()});render();
</script></body></html>
